
<div class="flex min-h-[80vh] items-center justify-center bg-[#151515] p-4">
  <div class="w-full max-w-md rounded-xl border border-[#a83232]/30 bg-[#1c1c1c] p-6 shadow-2xl shadow-black/40 sm:p-8">

    <div class="mb-8 text-center">
      <h1 class="text-3xl font-bold tracking-[0.15em] text-[#d45a5a]">
        SistemaRH
      </h1>

      <p class="mt-2 text-sm text-gray-400">
        Entre na sua conta
      </p>

      <div class="mx-auto mt-4 h-1 w-16 rounded-full bg-[#a83232]"></div>
    </div>

    <form class="space-y-5"[formGroup]="form" (ngSubmit)="entrar()">
      <div>
        <label
          for="email"
          class="mb-2 block text-sm font-medium text-[#d45a5a]"
        >
          E-mail
        </label>

        <input
          id="email"
          name="email"
          type="email"
          formControlName="email"
          placeholder="seu@email.com"
          class="w-full rounded-lg border border-[#a83232]/30 bg-[#151515] px-4 py-3 text-gray-100 placeholder-gray-500 outline-none transition duration-300 focus:border-[#c44747] focus:ring-2 focus:ring-[#a83232]/20"
        />
      </div>

      <div>
        <label
          for="senha"
          class="mb-2 block text-sm font-medium text-[#d45a5a]"
        >
          Senha
        </label>

        <input
          id="senha"
          name="senha"
          type="password"
          formControlName="senha"
          placeholder="Digite sua senha"
          class="w-full rounded-lg border border-[#a83232]/30 bg-[#151515] px-4 py-3 text-gray-100 placeholder-gray-500 outline-none transition duration-300 focus:border-[#c44747] focus:ring-2 focus:ring-[#a83232]/20"
        />
      </div>

      @if (erro()) {
        <p class="rounded-md bg-red-50 px-3 py-2 text-sm text-red-700">{{erro()}}</p>
      }

      <button
        type="submit"
        [disabled]="carregando()"
        class="w-full rounded-lg border border-[#a83232] bg-[#a83232] px-4 py-3 font-semibold text-white transition duration-300 hover:border-[#c44747] hover:bg-[#c44747] focus:outline-none focus:ring-2 focus:ring-[#c44747]/40 focus:ring-offset-2 focus:ring-offset-[#1c1c1c] disabled:cursor-not-allowed disabled:opacity-60"
      >
        {{ carregando() ? 'Entrando...' : 'Entrar'}}
      </button>
    </form>

    <p class="mt-7 text-center text-sm text-gray-400">
      Não possui uma conta?
      <a
        routerLink="/cadastro"
        class="ml-1 font-medium text-[#d45a5a] transition-colors duration-300 hover:text-[#e87979] hover:underline"
      >
        Cadastre-se
      </a>
    </p>

  </div>
</div>
